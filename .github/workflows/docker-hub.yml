name: Pull and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 清理不必要的磁盘空间
      - name: Clean up disk space
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      # 检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v7
        
      # 安装 jq 以处理 JSON 文件
      - name: Install jq
        run: sudo apt-get install -y jq
        
      # 登录到阿里云容器镜像服务
      - name: Log in to Alibaba Cloud Registry
        run: echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" registry.cn-guangzhou.aliyuncs.com --password-stdin
      
      # 拉取、变迁和推送 Docker 镜像
      - name: Pull, Tag, and Push Docker images
        env:
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
        run: |
          # 定义支持的架构列表
          SUPPORTED_ARCHS="arm64|amd64|arm|386"
          
          for line in $(jq -r '.[]' images.json); do
            echo "--- Processing line: ${line} ---"
            
            # 检测是否有架构前缀（格式：架构:镜像名）
            if [[ "$line" =~ ^($SUPPORTED_ARCHS): ]]; then
              # 提取架构
              platform="${line%%:*}"
              # 提取镜像名（去掉架构前缀）
              image="${line#*:}"
              echo "✓ Platform specified: ${platform}"
            else
              # 默认架构 - 使用 amd64 (x86)
              platform="amd64"
              image="${line}"
              echo "ℹ No platform specified, using default: ${platform} (x86)"
            fi
            
            echo "  Image: ${image}"
            
            # 1. 拉取镜像
            echo "  Pulling image with platform linux/${platform}..."
            docker pull --platform "linux/${platform}" "${image}" || {
              echo "  ❌ Failed to pull ${image}"
              continue
            }
            
            # 2. 构建阿里云镜像名
            # 提取 registry 后面的部分
            # ghcr.io/astral-sh/uv:python3.12-bookworm-slim -> astral-sh/uv:python3.12-bookworm-slim
            # node:22-alpine -> node:22-alpine
            # alpine:latest -> alpine:latest
            if [[ "$image" == */* ]]; then
              # 去掉第一个 / 之前的部分（registry）
              image_path="${image#*/}"
              # 如果还有 registry，继续去掉
              while [[ "$image_path" == */* && "$image_path" != *:* && "$image_path" != */*/* ]]; do
                # 检查是否是 library 格式
                if [[ "$image_path" == library/* ]]; then
                  break
                fi
                # 尝试去掉前缀
                temp="${image_path#*/}"
                if [[ "$temp" == */* ]] || [[ "$temp" == *:* ]]; then
                  image_path="$temp"
                else
                  break
                fi
              done
            else
              image_path="$image"
            fi
            
            aliyun_image="registry.cn-guangzhou.aliyuncs.com/${ALIYUN_NAMESPACE}/${image_path}"
            echo "  Target: ${aliyun_image}"
            
            # 3. 打标签
            echo "  Tagging ${image} as ${aliyun_image}"
            docker tag "${image}" "${aliyun_image}"
            
            # 4. 推送镜像到阿里云
            echo "  Pushing ${aliyun_image}"
            docker push "${aliyun_image}" || {
              echo "  ❌ Failed to push ${aliyun_image}"
              continue
            }
            
            echo "✅ Done"
            echo "------------------------------------"
          done
